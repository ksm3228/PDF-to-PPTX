<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>악보 이미지 → 키노트 변환기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --border: #e2e0d8;
    --text: #1a1917; --muted: #8a8880; --accent: #2d5be3;
    --accent-light: #eef1fd; --success: #1a7a4a; --success-bg: #edfaf3;
    --mono: 'DM Mono', monospace; --sans: 'Noto Sans KR', sans-serif;
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 3rem 1.5rem; }
  header { width: 100%; max-width: 640px; margin-bottom: 2.5rem; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo-icon { width: 36px; height: 36px; background: var(--text); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 20px; height: 20px; fill: white; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .subtitle { font-size: 14px; color: var(--muted); font-weight: 300; margin-top: 2px; }
  .card { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; margin-bottom: 1.25rem; }
  .drop-zone { border: 1.5px dashed var(--border); border-radius: 12px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg); }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-light); }
  .drop-icon { width: 48px; height: 48px; margin: 0 auto 16px; background: var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .drop-icon svg { width: 24px; height: 24px; stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .drop-title { font-size: 15px; font-weight: 500; margin-bottom: 6px; }
  .drop-sub { font-size: 13px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-family: var(--mono); background: var(--accent-light); color: var(--accent); padding: 3px 8px; border-radius: 4px; margin-top: 12px; }
  .section-label { font-size: 11px; font-family: var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
  .option-btn { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--bg); cursor: pointer; text-align: left; transition: all 0.15s; font-family: var(--sans); }
  .option-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .option-btn.selected { border-color: var(--accent); background: var(--accent-light); }
  .option-btn.selected .opt-title { color: var(--accent); }
  .opt-title { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
  .opt-desc { font-size: 11px; color: var(--muted); }
  .file-list { margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .file-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg); border-radius: 8px; border: 1px solid var(--border); font-size: 13px; cursor: grab; user-select: none; transition: background 0.15s; }
  .file-item:active { cursor: grabbing; }
  .file-item.dragging { opacity: 0.4; }
  .file-item.drag-over-item { border-color: var(--accent); background: var(--accent-light); }
  .file-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .file-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .file-item-num { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; min-width: 20px; text-align: right; }
  .file-item-del { width: 20px; height: 20px; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0; flex-shrink: 0; }
  .file-item-del:hover { color: #c0392b; }
  .add-more-btn { width: 100%; padding: 10px; background: transparent; border: 1px dashed var(--border); border-radius: 10px; font-size: 13px; color: var(--muted); cursor: pointer; font-family: var(--sans); margin-bottom: 1.25rem; transition: all 0.15s; }
  .add-more-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .convert-btn { width: 100%; padding: 14px; background: var(--text); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 500; font-family: var(--sans); cursor: pointer; transition: opacity 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .convert-btn:hover:not(:disabled) { opacity: 0.85; }
  .convert-btn:active:not(:disabled) { transform: scale(0.99); }
  .convert-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .convert-btn svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .progress-wrap { margin-bottom: 1rem; }
  .progress-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .progress-label { font-size: 13px; color: var(--muted); }
  .progress-pct { font-size: 13px; font-family: var(--mono); font-weight: 500; }
  .progress-track { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.3s ease; }
  .log-line { font-size: 12px; font-family: var(--mono); color: var(--muted); padding: 4px 0; border-top: 1px solid var(--border); margin-top: 8px; }
  .result-card { background: var(--success-bg); border: 1px solid #b7e8cd; border-radius: 16px; padding: 1.5rem 2rem; width: 100%; max-width: 640px; margin-bottom: 1.25rem; }
  .result-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--success); margin-bottom: 6px; }
  .result-title svg { width: 18px; height: 18px; stroke: var(--success); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .result-sub { font-size: 13px; color: var(--success); opacity: 0.8; margin-bottom: 1rem; }
  .btn-row { display: flex; gap: 10px; }
  .dl-btn { flex: 1; padding: 12px; background: var(--success); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; font-family: var(--sans); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
  .dl-btn:hover { opacity: 0.85; }
  .dl-btn svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .reset-btn { padding: 12px 18px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: var(--sans); cursor: pointer; transition: all 0.15s; }
  .reset-btn:hover { border-color: var(--text); color: var(--text); }
  footer { margin-top: 2rem; font-size: 12px; color: var(--muted); text-align: center; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo-row">
    <div class="logo-icon">
      <svg viewBox="0 0 20 20"><rect x="3" y="2" width="10" height="13" rx="1.5"/><path d="M7 16h8M11 6h2M11 9h2M5 9h4"/></svg>
    </div>
    <h1>악보 이미지 → 키노트 변환기</h1>
  </div>
  <p class="subtitle">JPG/PNG 이미지를 슬라이드로 변환 · 순서 조정 가능 · 서버 전송 없음</p>
</header>

<div class="card" id="uploadCard">
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="drop-icon">
      <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4l4 4"/><path d="M2 17l.621 2.485A2 2 0 0 0 4.561 21h14.878a2 2 0 0 0 1.94-1.515L22 17"/></svg>
    </div>
    <p class="drop-title">이미지 파일을 끌어다 놓거나 클릭해서 선택</p>
    <p class="drop-sub">JPG, PNG · 여러 장 동시 선택 가능 · Cmd+V로 붙여넣기</p>
    <span class="badge">캡처한 악보 이미지 그대로 변환</span>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/jpg" multiple style="display:none">
</div>

<div class="card hidden" id="optionCard">
  <p class="section-label">레이아웃</p>
  <div class="option-grid">
    <button class="option-btn selected" data-mode="2up" onclick="selectMode(this)">
      <div class="opt-title">2장 나란히 ★</div>
      <div class="opt-desc">A4 가로 · 슬라이드당 2장</div>
    </button>
    <button class="option-btn" data-mode="1up" onclick="selectMode(this)">
      <div class="opt-title">1장씩</div>
      <div class="opt-desc">슬라이드당 1장</div>
    </button>
  </div>
  <p class="section-label">파일 순서 <span style="font-weight:400;text-transform:none;letter-spacing:0;">(드래그로 순서 변경)</span></p>
  <div class="file-list" id="fileList"></div>
  <div style="display:flex; gap:8px; margin-bottom:1.25rem;">
  <button class="add-more-btn" style="margin-bottom:0; flex:1;" onclick="document.getElementById('fileInputMore').click()">+ 이미지 추가</button>
  <button class="add-more-btn" style="margin-bottom:0; flex:1;" onclick="pasteFromClipboard()">📋 클립보드에서 붙여넣기</button>
</div>
<input type="file" id="fileInputMore" accept="image/jpeg,image/png,image/jpg" multiple style="display:none">
  <button class="convert-btn" onclick="startConvert()">
    <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
    변환 시작
  </button>
</div>

<div class="card hidden" id="progressCard">
  <div class="progress-wrap">
    <div class="progress-row">
      <span class="progress-label" id="progressLabel">처리 중...</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="log-line" id="logLine">준비 중...</div>
</div>

<div class="result-card hidden" id="resultCard">
  <div class="result-title">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    변환 완료
  </div>
  <p class="result-sub" id="resultSub"></p>
  <div class="btn-row">
    <button class="dl-btn" id="dlBtn">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PPTX 다운로드
    </button>
    <button class="reset-btn" onclick="resetAll()">다시 변환</button>
  </div>
</div>

<footer>JSZip · 브라우저에서 100% 처리 · 파일 외부 전송 없음 · v1.6</footer>

<script>
let files = [];
let isPastingFromButton = false;
let selectedMode = '2up';
let pptxBlob = null;
let dragSrcIdx = null;
let pasteCounter = 0;

const A4W = 10692000;
const A4H = 7560000;

document.addEventListener('paste', e => {
  if (isPastingFromButton) return;
  const items = Array.from(e.clipboardData.items || []);
  const imgFiles = items
    .filter(item => item.type.startsWith('image/'))
    .map(item => item.getAsFile())
    .filter(Boolean);
  if (imgFiles.length) addFiles(imgFiles, true);
});

document.getElementById('fileInput').addEventListener('change', e => { addFiles(e.target.files, false); e.target.value=''; });
document.getElementById('fileInputMore').addEventListener('change', e => { addFiles(e.target.files, false); e.target.value=''; });

const fileListEl = document.getElementById('fileList');
fileListEl.addEventListener('dragover', e => e.preventDefault());
fileListEl.addEventListener('drop', e => {
  if (dragSrcIdx !== null) return;
  e.preventDefault();
  const fileImgs = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (fileImgs.length) addFiles(fileImgs, false);
});

const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', async e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const fileImgs = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (fileImgs.length) { addFiles(fileImgs, false); return; }
  const items = Array.from(e.dataTransfer.items || []);
  const blobImgs = [];
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const f = item.getAsFile();
      if (f) blobImgs.push(f);
    }
  }
  if (blobImgs.length) { addFiles(blobImgs, false); return; }
});

async function pasteFromClipboard() {
  isPastingFromButton = true;
  try {
    const items = await navigator.clipboard.read();
    const imgFiles = [];
    for (const item of items) {
      const imgType = item.types.find(t => t.startsWith('image/'));
      if (imgType) {
        const blob = await item.getType(imgType);
        imgFiles.push(new File([blob], '', { type: imgType }));
      }
    }
    if (imgFiles.length) {
      addFiles(imgFiles, true);
    } else {
      alert('클립보드에 이미지가 없어요.');
    }
  } catch(e) {
    alert('클립보드 접근 권한이 필요해요.\n브라우저에서 클립보드 접근을 허용해 주세요.');
  } finally {
    isPastingFromButton = false;
  }
}

function isGeneratedName(name) {
  if (!name || name === 'blob') return true;
  if (/^image\.(png|jpe?g)$/i.test(name)) return true;
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(\.(png|jpe?g))?$/i.test(name)) return true;
  return false;
}

function addFiles(fileList, fromPaste) {
  Array.from(fileList).forEach(f => {
    if (!f.type.startsWith('image/')) return;
    const url = URL.createObjectURL(f);
    let name;
    if (fromPaste || isGeneratedName(f.name)) {
      pasteCounter++;
      name = `클립보드_${pasteCounter}.png`;
    } else {
      name = f.name;
    }
    files.push({ file: f, url, name });
  });
  if (!fromPaste) {
    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  }
  if (files.length > 0) {
    document.getElementById('uploadCard').classList.add('hidden');
    document.getElementById('optionCard').classList.remove('hidden');
  }
  renderFileList();
}

function renderFileList() {
  const list = document.getElementById('fileList');
  list.innerHTML = '';
  files.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.draggable = true;
    item.dataset.idx = i;
    item.innerHTML = `
      <img class="file-thumb" src="${f.url}" alt="">
      <span class="file-item-name">${f.name}</span>
      <span class="file-item-num">${i+1}</span>
      <button class="file-item-del" onclick="removeFile(${i})">×</button>
    `;
    item.addEventListener('dragstart', e => { dragSrcIdx = i; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.file-item').forEach(el => el.classList.remove('drag-over-item')); });
    item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('drag-over-item'); });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over-item'));
    item.addEventListener('drop', e => {
      e.preventDefault(); item.classList.remove('drag-over-item');
      if (dragSrcIdx === null || dragSrcIdx === i) return;
      const moved = files.splice(dragSrcIdx, 1)[0];
      files.splice(i, 0, moved);
      dragSrcIdx = null;
      renderFileList();
    });
    list.appendChild(item);
  });
}

function removeFile(idx) {
  URL.revokeObjectURL(files[idx].url);
  files.splice(idx, 1);
  if (files.length === 0) resetAll();
  else renderFileList();
}

function selectMode(btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedMode = btn.dataset.mode;
}

async function startConvert() {
  if (files.length === 0) return;
  document.getElementById('optionCard').classList.add('hidden');
  document.getElementById('progressCard').classList.remove('hidden');
  setProgress(0, '이미지 로딩 중...');
  try {
    const images = [];
    for (let i = 0; i < files.length; i++) {
      log(`이미지 ${i+1} / ${files.length} 로딩 중`);
      setProgress(Math.round((i+1) / files.length * 60));
      const { b64, w, h, mime } = await fileToBase64(files[i].file);
      images.push({ b64, w, h, mime });
    }
    log('PPTX 구성 중...');
    setProgress(75);
    pptxBlob = selectedMode === '2up' ? await build2up(images) : await build1up(images);
    setProgress(100, '완료!');
    const slideCount = selectedMode === '2up' ? Math.ceil(files.length / 2) : files.length;
    document.getElementById('resultSub').textContent = `슬라이드 ${slideCount}장 생성 · 다운로드 후 더블클릭하면 키노트에서 바로 열립니다.`;
    document.getElementById('progressCard').classList.add('hidden');
    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('dlBtn').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(pptxBlob);
      a.download = 'score.pptx';
      a.click();
    };
  } catch(err) {
    log('오류: ' + err.message);
    console.error(err);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      const b64 = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
      URL.revokeObjectURL(url);
      resolve({ b64, w: img.width, h: img.height, mime: 'image/jpeg' });
    };
    img.onerror = reject;
    img.src = url;
  });
}

function setProgress(pct, label) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  if (label) document.getElementById('progressLabel').textContent = label;
}
function log(msg) { document.getElementById('logLine').textContent = msg; }

function resetAll() {
  files.forEach(f => URL.revokeObjectURL(f.url));
  files = []; pptxBlob = null; pasteCounter = 0;
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadCard').classList.remove('hidden');
  document.getElementById('optionCard').classList.add('hidden');
  document.getElementById('progressCard').classList.add('hidden');
  document.getElementById('resultCard').classList.add('hidden');
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  document.querySelector('[data-mode="2up"]').classList.add('selected');
  selectedMode = '2up';
}

async function build2up(images) {
  const zip = new JSZip();
  const slides = [];
  for (let i = 0; i < images.length; i += 2) slides.push([images[i], images[i+1]||null]);
  addBaseFiles(zip, slides.length, A4W, A4H);
  for (let si = 0; si < slides.length; si++) {
    const [left, right] = slides[si];
    const halfW = Math.floor(A4W / 2);
    const imgs = [], media = [];
    const lName = `image${si*2+1}.jpeg`;
    zip.file(`ppt/media/${lName}`, Uint8Array.from(atob(left.b64), c=>c.charCodeAt(0)));
    imgs.push({ x:0, y:0, cx:halfW, cy:A4H, rId:'rId1' });
    media.push({ rId:'rId1', name:lName });
    if (right) {
      const rName = `image${si*2+2}.jpeg`;
      zip.file(`ppt/media/${rName}`, Uint8Array.from(atob(right.b64), c=>c.charCodeAt(0)));
      imgs.push({ x:halfW, y:0, cx:halfW, cy:A4H, rId:'rId2' });
      media.push({ rId:'rId2', name:rName });
    }
    addSlide(zip, si+1, imgs, media, A4W, A4H);
  }
  return zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
}

async function build1up(images) {
  const zip = new JSZip();
  addBaseFiles(zip, images.length, A4W, A4H);
  for (let si = 0; si < images.length; si++) {
    const imgName = `image${si+1}.jpeg`;
    zip.file(`ppt/media/${imgName}`, Uint8Array.from(atob(images[si].b64), c=>c.charCodeAt(0)));
    addSlide(zip, si+1, [{x:0,y:0,cx:A4W,cy:A4H,rId:'rId1'}], [{rId:'rId1',name:imgName}], A4W, A4H);
  }
  return zip.generateAsync({ type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
}

function addBaseFiles(zip, n, W, H) {

function addSlide(zip, num, imgs, media, W, H) {
  const pics = imgs.map((img,idx) => `
<p:pic><p:nvPicPr><p:cNvPr id="${idx+2}" name="img${idx+1}"/><p:cNvPicPr/><p:nvPr/></p:nvPicPr>
<p:blipFill><a:blip r:embed="${img.rId}"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>
<p:spPr><a:xfrm><a:off x="${img.x}" y="${img.y}"/><a:ext cx="${img.cx}" cy="${img.cy}"/></a:xfrm>
<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`).join('');
  zip.file(`ppt/slides/slide${num}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<p:sld xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"
  xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
  xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">
<p:cSld><p:spTree>
<p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>
<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/><a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>
${pics}</p:spTree></p:cSld></p:sld>`);
  const rels = media.map(m=>`<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${m.name}"/>`).join('\n');
  zip.file(`ppt/slides/_rels/slide${num}.xml.rels`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${rels}
<Relationship Id="rIdL" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>
</Relationships>`);
}
